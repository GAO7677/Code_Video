  model_path: /data/gaoya/ckpt/TencentARC-InstantMesh/instant_mesh_large.ckpt
  texture_resolution: 1024
  render_resolution: 512
  zero123plus_v12: /data/gaoya/ckpt/sudo-ai-zero123plus-v1.2 # pretrained_models/zero123plus-v1.2