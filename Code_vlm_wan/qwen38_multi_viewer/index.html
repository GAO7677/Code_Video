<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3.8 / Physics Video Audit</title>
  <style>
    :root { --ink:#17252b; --paper:#eef4f1; --panel:#ffffff; --line:#c9d7d1; --muted:#61736e; --teal:#087d72; --teal-soft:#dff1eb; --orange:#df6b45; --orange-soft:#f9e6de; --blue:#48698e; --shadow:0 10px 26px rgba(23,37,43,.08); }
    * { box-sizing:border-box; } html { background:var(--paper); } body { min-width:320px; margin:0; color:var(--ink); background:var(--paper); font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; } button,input { font:inherit; } button { border:0; } :focus-visible { outline:3px solid rgba(223,107,69,.55); outline-offset:2px; }
    .top { min-height:72px; padding:14px 32px; color:#f7fbf8; background:var(--ink); border-bottom:4px solid var(--orange); }.top-inner { max-width:1740px; margin:auto; display:flex; gap:20px; align-items:center; justify-content:space-between; }.brand { display:flex; gap:12px; align-items:center; }.mark { display:grid; place-items:center; width:38px; height:38px; color:var(--ink); background:#b9d875; border-radius:5px; font:800 12px/1 ui-monospace,monospace; }.eyebrow,.label { color:var(--teal); font:700 10px/1.2 ui-monospace,monospace; letter-spacing:.09em; text-transform:uppercase; }.eyebrow { margin:0 0 4px; color:#b9d875; }.brand h1 { margin:0; font-size:18px; line-height:1.1; letter-spacing:0; }.run { color:#c9d8d3; font:11px/1.4 ui-monospace,monospace; text-align:right; }
    main { max-width:1740px; margin:auto; padding:28px 32px 46px; }.overview { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:26px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--line); }.overview h2 { margin:5px 0 0; max-width:750px; font-size:31px; line-height:1.13; letter-spacing:0; }.overview p { max-width:810px; margin:10px 0 0; color:var(--muted); }.metrics { display:grid; grid-template-columns:repeat(4,auto); border-left:1px solid var(--line); }.metric { min-width:90px; padding:0 14px; border-right:1px solid var(--line); }.metric strong { display:block; font:800 23px/1 ui-monospace,monospace; }.metric span { display:block; margin-top:6px; color:var(--muted); font:9px/1.2 ui-monospace,monospace; text-transform:uppercase; }
    .toolbar { display:flex; gap:14px; align-items:center; justify-content:space-between; padding:18px 0; }.filters { display:flex; gap:7px; flex-wrap:wrap; }.filter { padding:8px 11px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:4px; cursor:pointer; font-size:12px; font-weight:700; }.filter:hover { background:var(--teal-soft); border-color:var(--teal); }.filter.active { color:#fff; background:var(--teal); border-color:var(--teal); }.search { width:280px; padding:8px 10px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:4px; }
    .workspace { display:grid; grid-template-columns:245px minmax(0,1fr); gap:22px; align-items:start; }.rail { position:sticky; top:18px; border-top:2px solid var(--ink); }.rail h3 { margin:0; padding:11px 2px; font-size:13px; }.case-list { max-height:calc(100vh - 250px); overflow:auto; border-bottom:1px solid var(--line); }.case-button { display:block; width:100%; padding:13px 11px 12px; color:var(--ink); background:transparent; border-bottom:1px solid var(--line); border-left:3px solid transparent; text-align:left; cursor:pointer; }.case-button:hover { background:rgba(255,255,255,.6); }.case-button.active { background:var(--orange-soft); border-left-color:var(--orange); }.case-num { color:var(--orange); font:800 10px/1 ui-monospace,monospace; }.case-family { display:block; margin-top:5px; overflow-wrap:anywhere; font-size:12px; font-weight:800; }.case-id { display:block; margin-top:4px; color:var(--muted); font:10px/1.35 ui-monospace,monospace; overflow-wrap:anywhere; }
    .case { min-width:0; }.case-head { display:flex; gap:14px; align-items:flex-start; justify-content:space-between; padding:0 0 13px; border-bottom:2px solid var(--ink); }.case-head h3 { margin:5px 0 0; font-size:21px; line-height:1.2; }.tag { padding:5px 7px; color:var(--teal); background:var(--teal-soft); border-radius:3px; font:700 10px/1 ui-monospace,monospace; text-transform:uppercase; }.case-path { margin:6px 0 0; color:var(--muted); font:10px/1.4 ui-monospace,monospace; overflow-wrap:anywhere; }.stage-flow { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:16px 0; }.stage { min-height:62px; padding:11px 13px; background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--teal); border-radius:6px; box-shadow:var(--shadow); }.stage:nth-child(2){border-top-color:var(--blue)}.stage:nth-child(3){border-top-color:var(--orange)}.stage strong { display:block; margin-top:4px; font-size:14px; }.stage span { color:var(--muted); font-size:11px; }
    .media-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }.media { min-width:0; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); }.media-head { min-height:56px; padding:10px 12px; border-bottom:1px solid var(--line); }.media h4 { margin:4px 0 0; font-size:15px; }.media video { display:block; width:100%; aspect-ratio:16/9; object-fit:contain; background:#102025; }.media-meta { padding:9px 12px; color:var(--muted); font:10px/1.45 ui-monospace,monospace; overflow-wrap:anywhere; }
    .lower { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:12px; margin-top:12px; }.sheet-panel,.caption-panel,.audit-panel { overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); }.panel-head { padding:11px 13px; border-bottom:1px solid var(--line); }.panel-head h4 { margin:4px 0 0; font-size:15px; }.sheet-wrap { max-height:440px; overflow:auto; background:#132326; }.sheet { display:block; width:100%; min-width:620px; }.caption-panel { padding:16px; border-left:4px solid var(--orange); }.caption-panel p { margin:9px 0 0; font-size:15px; line-height:1.6; }.audit-panel { margin-top:12px; padding:14px; }.audit-panel dl { display:grid; grid-template-columns:118px minmax(0,1fr); gap:7px 9px; margin:8px 0 0; }.audit-panel dt { color:var(--muted); font:9px/1.35 ui-monospace,monospace; text-transform:uppercase; }.audit-panel dd { margin:0; overflow-wrap:anywhere; font:10px/1.35 ui-monospace,monospace; }.empty,.error { padding:22px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:6px; }.error { color:#8d3725; background:var(--orange-soft); border-color:#edb39f; }
    @media(max-width:980px){.top,.top-inner{padding-left:18px;padding-right:18px}.top-inner,.overview{align-items:start;flex-direction:column}.overview{grid-template-columns:1fr}.metrics{border-left:0}.workspace{grid-template-columns:1fr}.rail{position:static}.case-list{max-height:220px}.stage-flow,.media-grid,.lower{grid-template-columns:1fr}main{padding:20px 18px 36px}.search{width:100%}.toolbar{align-items:stretch;flex-direction:column}.run{text-align:left}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><div class="brand"><div class="mark">VLM</div><div><p class="eyebrow">GPU / multi-case audit</p><h1>Qwen3.8 Physics Video Captions</h1></div></div><div id="run" class="run">读取运行数据...</div></div></header>
  <main><section class="overview"><div><div class="label">exact model inputs & outputs</div><h2 id="overview-title">物理视频的可核查输入链路</h2><p>每个 case 都提供源视频、qwen_vl_utils 实际抽取的帧、由模型视觉 patch 张量反解的处理器回放，以及对应的生成描述。</p></div><div id="metrics" class="metrics"></div></section><section class="toolbar"><div id="filters" class="filters"></div><input id="search" class="search" placeholder="筛选 case"></section><section class="workspace"><aside class="rail"><h3>Cases</h3><div id="case-list" class="case-list"></div></aside><section id="content" class="case"><div class="empty">读取中...</div></section></section></main>
  <script>
    const state={cases:[],visible:[],selected:null,filter:'all',query:''}; const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}; const shape=x=>Array.isArray(x)?'['+x.join(' x ')+']':'--'; const seconds=x=>Number.isFinite(x)?x.toFixed(1)+' s':'--';
    function renderMetrics(){const area=document.getElementById('metrics');area.replaceChildren();const avg=state.cases.length?state.cases.reduce((s,c)=>s+(c.elapsed_seconds||0),0)/state.cases.length:0;const request=state.cases[0]?.video_request||{};[[String(state.cases.length),'cases'],[String(request.fps??'--'),'request FPS'],[String(request.max_frames??'--'),'frame cap'],[seconds(avg),'avg run']].forEach(([v,l])=>{const a=el('div','metric');a.append(el('strong','',v),el('span','',l));area.append(a)});}
    function renderFilters(){const host=document.getElementById('filters');host.replaceChildren();['all',...new Set(state.cases.map(c=>c.dataset))].forEach(filter=>{const button=el('button','filter'+(state.filter===filter?' active':''),filter==='all'?'全部':filter);button.type='button';button.onclick=()=>{state.filter=filter;renderFilters();renderList();renderCase();};host.append(button);});}
    function matches(c){return (state.filter==='all'||c.dataset===state.filter)&&(`${c.case_id} ${c.family} ${c.sample}`.toLowerCase().includes(state.query.toLowerCase()));}
    function renderList(){state.visible=state.cases.filter(matches);if(!state.visible.some(c=>c.case_id===state.selected))state.selected=state.visible[0]?.case_id||null;const list=document.getElementById('case-list');list.replaceChildren();if(!state.visible.length){list.append(el('div','empty','没有匹配的 case'));return;}state.visible.forEach(c=>{const b=el('button','case-button'+(c.case_id===state.selected?' active':''),undefined);b.type='button';b.onclick=()=>{state.selected=c.case_id;renderList();renderCase();};b.append(el('span','case-num','CASE '+String(c.case_number).padStart(2,'0')),el('span','case-family',c.family),el('span','case-id',c.comparison_variant||c.sample));list.append(b)});}
    function video(title,label,url,meta){const card=el('article','media');const h=el('div','media-head');h.append(el('div','label',label),el('h4','',title));const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=url;card.append(h,v,el('div','media-meta',meta));return card;}
    function addAudit(dl,k,v){dl.append(el('dt','',k),el('dd','',v));}
    function renderCase(){const host=document.getElementById('content');const c=state.cases.find(x=>x.case_id===state.selected);host.replaceChildren();if(!c){host.append(el('div','empty','选择一个 case'));return;}const a=c.audit;const head=el('header','case-head');const left=el('div');left.append(el('div','label','case '+String(c.case_number).padStart(2,'0')),el('h3','',c.family+' / '+c.sample),el('p','case-path',c.source_video));head.append(left,el('div','tag',c.dataset));host.append(head);
      const flow=el('section','stage-flow');[['01 source',`${a.source_total_frames} frames / ${a.source_fps} FPS`],['02 selected',`${a.sampled_frame_count} frames / indices recorded`],['03 patch tensor',`${shape(a.pixel_values_videos_shape)} / grid ${shape(a.video_grid_thw)}`]].forEach(([x,y])=>{const n=el('div','stage');n.append(el('div','label',x),el('strong','',y));flow.append(n)});host.append(flow);
      const media=el('section','media-grid');media.append(video('源视频','source file',c.assets.source,`${a.source_total_frames} frames / ${a.source_fps} FPS`),video('实际采样帧','qwen_vl_utils output',c.assets.sampled,`${a.sampled_frame_count} frames / replay ${a.input_replay_fps.toFixed(2)} FPS / ${shape(a.raw_video_shape)}`),video('处理器输入回放','pixel_values decoded',c.assets.processor,`${shape(a.processor_frame_shape)} / grid ${shape(a.video_grid_thw)}`));host.append(media);
      const lower=el('section','lower');const sheet=el('article','sheet-panel');const sh=el('div','panel-head');sh.append(el('div','label','temporal contact sheet'),el('h4','',`模型实际采样的 ${a.sampled_frame_count} 个时间位置`));const wrap=el('div','sheet-wrap');const img=document.createElement('img');img.className='sheet';img.src=c.assets.sheet;img.alt='采样帧接触表';wrap.append(img);sheet.append(sh,wrap);const side=el('div','');const cap=el('article','caption-panel');cap.append(el('div','label',`GPU${c.physical_gpu??'--'} caption / ${c.comparison_variant||'result'}`),el('p','',c.caption||c.error||'无输出'));const audit=el('article','audit-panel');audit.append(el('div','label','input tensor audit'));const dl=document.createElement('dl');[['input_ids',shape(a.input_ids_shape)],['raw video',shape(a.raw_video_shape)],['processor frames',shape(a.processor_frame_shape)],['pixel values',shape(a.pixel_values_videos_shape)],['video grid',shape(a.video_grid_thw)],['frame indices',a.frames_indices.join(', ')],['runtime',seconds(c.elapsed_seconds)]].forEach(x=>addAudit(dl,...x));audit.append(dl);side.append(cap,audit);lower.append(sheet,side);host.append(lower);}
    function render(){renderMetrics();renderFilters();renderList();renderCase();}
    document.getElementById('search').oninput=e=>{state.query=e.target.value;renderList();renderCase();};
    fetch('/api/data',{cache:'no-store'}).then(r=>r.json()).then(data=>{state.cases=data.cases;document.getElementById('overview-title').textContent=`${data.cases.length} 个物理视频的可核查输入链路`;const gpus=[...new Set(data.cases.map(c=>c.physical_gpu).filter(x=>x!==undefined))].join(',');document.getElementById('run').textContent=`GPU ${gpus||'--'} | ${data.cases.length} completed cases | Qwen fast path enabled`;render();}).catch(e=>{document.getElementById('content').replaceChildren(el('div','error','无法读取页面数据：'+e.message));});
  </script>
</body>
</html>
