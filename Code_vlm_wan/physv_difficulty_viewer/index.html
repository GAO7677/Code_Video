<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysV Difficulty Pilot</title>
  <style>
    :root { --ink:#17252d; --muted:#63727a; --line:#d7dfe2; --paper:#f3f6f6; --panel:#fff; --teal:#087f82; --orange:#c8662f; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.5 Inter,system-ui,sans-serif; }
    button,select { font:inherit; }
    .topbar { min-height:68px; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; color:#fff; background:#17252d; }
    .topbar strong { font-size:18px; }
    .topbar span { color:#b9c8ce; font-size:12px; }
    .shell { max-width:1700px; margin:0 auto; padding:20px 24px 28px; }
    .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
    select { min-width:180px; padding:8px 10px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:5px; }
    .count { color:var(--muted); font-size:12px; }
    .workspace { display:grid; grid-template-columns:260px minmax(420px,1.1fr) minmax(420px,1fr); gap:16px; align-items:start; }
    .panel { overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    .panel-head { display:flex; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:13px; }
    .case-list { padding:8px; max-height:calc(100vh - 170px); overflow:auto; }
    .case-button { width:100%; margin-bottom:6px; padding:11px 12px; text-align:left; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; }
    .case-button:hover { background:#f0f5f5; }
    .case-button.active { background:#e4f2f0; border-color:#a8d4d0; }
    .case-id { display:block; font-weight:700; overflow-wrap:anywhere; }
    .case-meta { display:block; margin-top:5px; color:var(--muted); font-size:12px; }
    .level { display:inline-block; margin-right:5px; padding:2px 6px; color:#fff; background:var(--teal); border-radius:4px; font-size:11px; font-weight:700; }
    video { display:block; width:100%; aspect-ratio:16/9; background:#10171b; object-fit:contain; }
    .video-caption { padding:12px 16px 0; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; padding:14px 16px 16px; }
    .fact { padding:10px; background:#f5f7f8; border-left:3px solid var(--orange); }
    .fact label { display:block; margin-bottom:3px; color:var(--muted); font-size:11px; text-transform:uppercase; }
    .fact span { display:block; overflow-wrap:anywhere; }
    .content { padding:16px; }
    .content h3 { margin:0 0 7px; font-size:13px; }
    .content p { margin:0 0 14px; color:var(--muted); }
    pre { max-height:40vh; margin:0; padding:12px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; color:#24343b; background:#f5f7f8; font:12px/1.55 ui-monospace,monospace; }
    details { border-top:1px solid var(--line); }
    details summary { padding:12px 16px; color:var(--teal); font-weight:700; cursor:pointer; }
    .question { padding:0 16px 16px; white-space:pre-wrap; color:var(--muted); }
    @media (max-width:1100px) { .workspace { grid-template-columns:220px minmax(0,1fr); } .info-panel { grid-column:1/-1; } }
    @media (max-width:720px) { .topbar { padding:13px 16px; } .shell { padding:14px 12px 22px; } .workspace { display:flex; flex-direction:column; } .case-panel,.video-panel,.info-panel { width:100%; } .case-list { max-height:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; } .case-button { margin:0; } }
  </style>
</head>
<body>
  <header class="topbar"><strong>PhysV / Difficulty Pilot</strong><span id="status">正在读取仿真结果...</span></header>
  <main class="shell">
    <div class="toolbar"><label for="level-filter">难度筛选</label><select id="level-filter"><option value="all">全部等级</option><option value="L1">L1 基础场景</option><option value="L2">L2 多阶段场景</option><option value="L3">L3 交互场景</option></select><span class="count" id="count"></span></div>
    <section class="workspace" id="workspace" hidden>
      <aside class="panel case-panel"><div class="panel-head"><h2>Cases</h2><span class="count" id="case-count"></span></div><div class="case-list" id="case-list"></div></aside>
      <section class="panel video-panel"><div class="panel-head"><h2 id="title">Video</h2><span class="count" id="video-status"></span></div><video id="video" controls preload="metadata"></video><div class="video-caption" id="caption"></div><div class="facts" id="facts"></div><details><summary>问题</summary><div class="question" id="question"></div></details></section>
      <section class="panel info-panel"><div class="panel-head"><h2>场景与仿真状态</h2><span class="count">scene-first</span></div><div class="content"><h3>难度</h3><p id="difficulty"></p><h3>场景机制（不是运动结果标签）</h3><p id="scene"></p><h3>仿真状态摘要</h3><pre id="summary"></pre><h3>场景参数</h3><pre id="spec"></pre></div></section>
    </section>
  </main>
  <script>
    const state = { rows: [], filtered: [], selected: 0 };
    const $ = (id) => document.getElementById(id);
    function renderList() {
      const list = $("case-list"); list.replaceChildren();
      state.filtered.forEach((row, index) => {
        const button = document.createElement("button"); button.className = `case-button${index === state.selected ? " active" : ""}`;
        const level = row.difficulty || {}; button.innerHTML = `<span class="case-id"></span><span class="case-meta"><i class="level"></i><span></span></span>`;
        button.querySelector(".case-id").textContent = row.case_id;
        button.querySelector(".level").textContent = level.level || "-";
        button.querySelector(".case-meta span").textContent = `${level.title || ""} / ${row.scene_family?.title || row.scene_family?.family_key || ""}`;
        button.addEventListener("click", () => { state.selected = index; render(); }); list.appendChild(button);
      });
      $("case-count").textContent = `${state.filtered.length} cases`;
    }
    function render() {
      const row = state.filtered[state.selected]; if (!row) return;
      renderList(); const level = row.difficulty || {}; const summary = row.state_summary || {};
      $("title").textContent = row.case_id; $("video-status").textContent = row.status || "rendered"; $("video").src = row.video_url; $("video").load();
      $("caption").textContent = row.video || ""; $("difficulty").textContent = `${level.level || "-"} / ${level.title || "-"}：${level.description || ""}`;
      const family = row.scene_family || {}; $("scene").textContent = `${family.family_key || "-"} ${family.title || ""}：${family.description || ""}`;
      $("question").textContent = row.question || "";
      $("summary").textContent = JSON.stringify(summary, null, 2); $("spec").textContent = JSON.stringify(row.scenario_spec || {}, null, 2);
      const facts = [["Input", `${row.width || 1280} x ${row.height || 720}`],["Objects", `${summary.objects?.length || 0}`],["Final state", summary.final_motion_state || "-"],["States", row.states ? "preserved" : "missing"],["Masks", row.mask_ids ? "preserved" : "missing"],["Answer", row.answer_source || "-" ]];
      const box = $("facts"); box.replaceChildren(); facts.forEach(([label,value]) => { const item=document.createElement("div"); item.className="fact"; item.innerHTML="<label></label><span></span>"; item.querySelector("label").textContent=label; item.querySelector("span").textContent=value; box.appendChild(item); });
    }
    $("level-filter").addEventListener("change", (event) => { const value=event.target.value; state.filtered=value === "all" ? state.rows.slice() : state.rows.filter((row) => row.difficulty?.level === value); state.selected=0; render(); $("count").textContent=`${state.filtered.length}/${state.rows.length} loaded`; });
    fetch("/api/results").then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }).then((rows) => { state.rows=rows; state.filtered=rows.slice(); $("workspace").hidden=false; $("status").textContent="Ready"; $("count").textContent=`${rows.length} loaded`; render(); }).catch((error) => { $("status").textContent=`读取失败: ${error.message}`; });
  </script>
</body>
</html>
