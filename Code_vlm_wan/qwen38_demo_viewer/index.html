<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3.8 Video Input Audit</title>
  <style>
    :root { --ink:#17252b; --paper:#f0f5f2; --panel:#fff; --line:#cbd8d2; --muted:#62756f; --teal:#087b72; --teal-soft:#dff1eb; --orange:#e26c45; --orange-soft:#f9e7df; --blue:#3e628e; --shadow:0 10px 26px rgba(23,37,43,.08); }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--ink); background:var(--paper); font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    .top { padding:18px 32px; color:#f7fbf8; background:var(--ink); border-bottom:4px solid var(--orange); } .top-inner { max-width:1560px; margin:auto; display:flex; gap:18px; align-items:center; justify-content:space-between; }
    .mark { display:grid; place-items:center; width:38px; height:38px; background:#b7d774; color:var(--ink); border-radius:5px; font:800 12px/1 ui-monospace,monospace; } .brand { display:flex; gap:12px; align-items:center; }.brand h1 { margin:0; font-size:18px; letter-spacing:0; }.eyebrow,.label { font:700 10px/1.2 ui-monospace,monospace; letter-spacing:.09em; text-transform:uppercase; }.eyebrow { margin:0 0 4px; color:#b7d774; }.run { color:#c8d7d2; font:12px/1.4 ui-monospace,monospace; text-align:right; }
    main { max-width:1560px; margin:auto; padding:28px 32px 48px; }.headline { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--line); }.headline h2 { margin:5px 0 0; font-size:31px; line-height:1.13; letter-spacing:0; }.headline p { max-width:770px; margin:10px 0 0; color:var(--muted); }.metrics { display:grid; grid-template-columns:repeat(4,auto); border-left:1px solid var(--line); }.metric { min-width:95px; padding:0 14px; border-right:1px solid var(--line); }.metric strong { display:block; font:800 23px/1 ui-monospace,monospace; }.metric span { display:block; margin-top:6px; color:var(--muted); font:9px/1.2 ui-monospace,monospace; text-transform:uppercase; }
    .flow { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:24px 0; }.flow-step { position:relative; min-height:72px; padding:13px 15px; background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--teal); border-radius:6px; box-shadow:var(--shadow); }.flow-step:nth-child(2) { border-top-color:var(--blue); }.flow-step:nth-child(3) { border-top-color:var(--orange); }.flow-step strong { display:block; margin-top:5px; font-size:15px; }.flow-step span { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }.card { min-width:0; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); }.card-head { min-height:60px; padding:12px 14px; border-bottom:1px solid var(--line); }.card h3 { margin:4px 0 0; font-size:16px; }.card video { display:block; width:100%; aspect-ratio:16/9; background:#0f1c20; object-fit:contain; }.card .meta { padding:10px 14px; color:var(--muted); font:11px/1.45 ui-monospace,monospace; overflow-wrap:anywhere; }
    .full-card { margin-top:14px; }.sheet { display:block; width:100%; background:#132326; }.sheet-wrap { overflow:auto; max-height:560px; background:#132326; }.caption-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr); gap:14px; margin-top:14px; }.caption { min-height:142px; padding:18px; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--orange); border-radius:6px; box-shadow:var(--shadow); }.caption p { margin:10px 0 0; font-size:16px; line-height:1.6; }.audit { padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); }.audit dl { display:grid; grid-template-columns:122px minmax(0,1fr); gap:8px 12px; margin:10px 0 0; }.audit dt { color:var(--muted); font:10px/1.35 ui-monospace,monospace; text-transform:uppercase; }.audit dd { margin:0; overflow-wrap:anywhere; font:11px/1.35 ui-monospace,monospace; }.comparison { margin-top:14px; padding:14px 16px; background:var(--teal-soft); border:1px solid #afdbcf; border-radius:6px; }.comparison strong { color:var(--teal); }.comparison p { margin:5px 0 0; }.error { padding:24px; color:#8d3725; background:var(--orange-soft); border:1px solid #efb29d; border-radius:6px; }
    @media (max-width:980px) { .top,.top-inner { padding-left:18px;padding-right:18px; }.top-inner,.headline { align-items:start; flex-direction:column; }.headline { grid-template-columns:1fr; }.metrics { border-left:0; }.flow,.grid,.caption-grid { grid-template-columns:1fr; } main { padding:20px 18px 38px; } .run { text-align:left; } }.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><div class="brand"><div class="mark">VLM</div><div><p class="eyebrow">GPU7 inference audit</p><h1>Qwen3.8 Video Caption</h1></div></div><div id="run" class="run">读取运行信息...</div></div></header>
  <main id="app"><p>读取可视化数据...</p></main>
  <script>
    const el = (tag, cls, text) => { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; };
    const shape = value => Array.isArray(value) ? '[' + value.join(' x ') + ']' : '--';
    const seconds = value => Number.isFinite(value) ? value.toFixed(1) + ' s' : '--';
    function videoCard(title, eyebrow, url, meta) { const card=el('section','card'); const head=el('div','card-head'); head.append(el('div','label',eyebrow),el('h3','',title)); const video=document.createElement('video'); video.controls=true; video.preload='metadata'; video.src=url; card.append(head,video,el('div','meta',meta)); return card; }
    function auditRow(name,value) { const pair=document.createDocumentFragment(); pair.append(el('dt','',name),el('dd','',value)); return pair; }
    async function main() {
      const app=document.getElementById('app');
      try {
        const data=await (await fetch('/api/data',{cache:'no-store'})).json(); const run=data.run, audit=data.input_audit, previous=data.previous_run;
        document.getElementById('run').textContent=`GPU ${run.physical_gpu} | fast path ${run.runtime.qwen_fast_path ? 'enabled' : 'off'} | ${seconds(run.total_seconds)} total`;
        app.replaceChildren();
        const headline=el('section','headline'); const intro=el('div'); intro.append(el('div','label','exact model input / output'),el('h2','', '从采样帧到 caption 的可核查链路'),el('p','', '中间两段视频不是重新抽样的展示素材：左侧是 qwen_vl_utils 返回的实际采样帧，右侧是由 pixel_values_videos 反解、去归一化后的处理器输入回放。'));
        const metrics=el('div','metrics'); [['44','sampled frames'],[String(audit.source_fps),'source fps'],[String(run.input_shapes.input_ids[1]),'input tokens'],[seconds(run.generation_seconds),'generation']].forEach(([v,l])=>{const m=el('div','metric');m.append(el('strong','',v),el('span','',l));metrics.append(m)}); headline.append(intro,metrics); app.append(headline);
        const flow=el('section','flow'); [['01 source','30 FPS / 90 frames'],['02 actual selection','44 frames at indices shown below'],['03 model tensor','pixel patches plus caption']].forEach(([a,b])=>{const n=el('div','flow-step');n.append(el('div','label',a),el('strong','',b));flow.append(n)}); app.append(flow);
        const grid=el('section','grid'); grid.append(videoCard('源视频','source file',data.source_video_url,`${audit.source_total_frames} frames / ${audit.source_fps} FPS`),videoCard('实际采样帧','qwen_vl_utils output',data.sampled_frames_url,`${audit.sampled_frame_count} frames / replay ${audit.input_replay_fps.toFixed(2)} FPS / ${shape(audit.raw_video_shape)}`),videoCard('处理器输入回放','pixel_values_videos decoded',data.processor_frames_url,`${shape(audit.processor_frame_shape)} / grid ${shape(audit.video_grid_thw)}`)); app.append(grid);
        const sheetCard=el('section','card full-card'); const sheetHead=el('div','card-head'); sheetHead.append(el('div','label','temporal contact sheet'),el('h3','', '模型实际采样的 44 个时间位置')); const sw=el('div','sheet-wrap'); const sheet=document.createElement('img'); sheet.className='sheet'; sheet.alt='实际采样帧接触表'; sheet.src=data.sampled_contact_sheet_url; sw.append(sheet); sheetCard.append(sheetHead,sw,el('div','meta','每张格的 # 表示源视频帧索引；秒数由源视频 30 FPS 换算。')); app.append(sheetCard);
        const cg=el('section','caption-grid'); const caption=el('article','caption'); caption.append(el('div','label','current GPU7 output'),el('p','',run.caption)); const aud=el('aside','audit'); aud.append(el('div','label','input tensor audit')); const dl=document.createElement('dl'); [['pixel_values_videos',shape(audit.pixel_values_videos_shape)],['video_grid_thw',shape(audit.video_grid_thw)],['input_ids',shape(audit.input_ids_shape)],['raw video',shape(audit.raw_video_shape)],['processor frames',shape(audit.processor_frame_shape)],['frame indices',audit.frames_indices.join(', ')],['loader audit','missing 0 / unexpected 0 / mismatched 0']].forEach(x=>dl.append(auditRow(...x))); aud.append(dl); cg.append(caption,aud); app.append(cg);
        if(previous) { const c=el('section','comparison'); c.append(el('strong','', '与安装 FLA 前的结果'),el('p','',`上次总耗时 ${seconds(previous.elapsed_seconds)}；本次 ${seconds(run.total_seconds)}，生成阶段 ${seconds(run.generation_seconds)}。两次均使用相同视频与 15 FPS 请求，当前运行已确认 fast path 启用。`)); app.append(c); }
      } catch (error) { app.replaceChildren(el('div','error','无法读取可视化数据：' + error.message)); }
    } main();
  </script>
</body>
</html>
