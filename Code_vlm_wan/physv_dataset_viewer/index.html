<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysV 控制变量实验组</title>
  <style>
    :root { --bg:#e9efec; --paper:#fff; --ink:#18251f; --muted:#65736c; --line:#c9d4ce; --deep:#183a30; --green:#087c6d; --green-soft:#e0f0eb; --red:#b65339; --red-soft:#f7e8e2; --yellow:#d4e475; }
    * { box-sizing:border-box; }
    html { background:var(--bg); }
    body { min-width:320px; margin:0; color:var(--ink); background:var(--bg); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { color:inherit; font:inherit; }
    button:focus-visible { outline:3px solid #5aafa1; outline-offset:2px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .topbar { padding:14px 28px; color:#f4faf7; background:var(--deep); border-bottom:4px solid var(--red); }
    .topbar-inner { max-width:1800px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { display:grid; place-items:center; width:40px; height:40px; color:var(--deep); background:var(--yellow); border-radius:4px; font:900 11px/1 ui-monospace,monospace; }
    .brand h1 { margin:0; font-size:18px; line-height:1.2; }
    .brand p { margin:3px 0 0; color:#bdd0c7; font:10px/1.3 ui-monospace,monospace; }
    .refresh { min-height:36px; padding:7px 12px; color:#fff; background:transparent; border:1px solid #6d8a7e; border-radius:4px; cursor:pointer; font-weight:750; }
    .refresh:hover { color:var(--deep); background:var(--yellow); border-color:var(--yellow); }
    .refresh:disabled { opacity:.55; cursor:wait; }
    main { max-width:1800px; margin:auto; padding:22px 28px 48px; }
    .directory { display:grid; grid-template-columns:repeat(8,minmax(130px,1fr)); border:1px solid var(--line); background:var(--paper); }
    .group-tab { min-height:78px; padding:10px 11px; text-align:left; background:transparent; border:0; border-right:1px solid var(--line); cursor:pointer; }
    .group-tab:last-child { border-right:0; }
    .group-tab:hover { background:var(--green-soft); }
    .group-tab.active { color:#fff; background:var(--green); }
    .group-code { display:block; font:800 10px/1.2 ui-monospace,monospace; }
    .group-name { display:block; margin-top:5px; font-size:13px; font-weight:800; }
    .group-stat { display:block; margin-top:3px; color:var(--muted); font:10px/1.2 ui-monospace,monospace; }
    .group-tab.active .group-stat { color:#d4eee7; }
    .group-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:end; margin-top:24px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
    .eyebrow { color:var(--green); font:800 10px/1.2 ui-monospace,monospace; text-transform:uppercase; }
    .group-head h2 { margin:5px 0 0; font-size:27px; line-height:1.15; letter-spacing:0; }
    .group-summary { display:flex; gap:20px; }
    .summary-item { min-width:105px; padding-left:12px; border-left:1px solid var(--line); }
    .summary-item strong { display:block; font:850 20px/1 ui-monospace,monospace; }
    .summary-item span { display:block; margin-top:5px; color:var(--muted); font-size:10px; }
    .matrix-wrap { margin-top:14px; overflow-x:auto; background:var(--paper); border:1px solid var(--line); }
    .matrix-title { display:flex; justify-content:space-between; gap:16px; padding:10px 12px; border-bottom:1px solid var(--line); }
    .matrix-title h3 { margin:0; font-size:13px; }
    .matrix-title span { color:var(--muted); font-size:10px; }
    .matrix { width:100%; min-width:660px; border-collapse:collapse; font-size:11px; }
    .matrix th,.matrix td { padding:7px 9px; text-align:center; border-right:1px solid #e1e8e4; border-bottom:1px solid #e1e8e4; }
    .matrix th:first-child { width:190px; text-align:left; }
    .matrix tbody th { color:var(--muted); font:10px/1.25 ui-monospace,monospace; }
    .matrix td { font:750 11px/1 ui-monospace,monospace; }
    .matrix td.self { color:var(--muted); background:#f2f5f3; }
    .matrix td.high { color:#086758; background:var(--green-soft); }
    .matrix td.low { color:#963f2b; background:var(--red-soft); }
    .case-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:18px; }
    .case-card { min-width:0; overflow:hidden; background:var(--paper); border:1px solid var(--line); border-radius:6px; }
    .case-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; min-height:70px; padding:12px 14px; border-bottom:1px solid var(--line); }
    .case-head h3 { margin:3px 0 0; font-size:15px; line-height:1.25; overflow-wrap:anywhere; }
    .case-id { color:var(--muted); font:9px/1.3 ui-monospace,monospace; overflow-wrap:anywhere; }
    .control { flex:0 0 auto; min-width:90px; padding-left:11px; border-left:3px solid var(--red); }
    .control strong { display:block; font:850 17px/1.1 ui-monospace,monospace; }
    .control span { display:block; margin-top:4px; color:var(--muted); font-size:9px; overflow-wrap:anywhere; }
    .case-card video { display:block; width:100%; aspect-ratio:16/9; object-fit:contain; background:#11201a; }
    .case-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .case-metric { min-width:0; padding:10px 11px; border-right:1px solid var(--line); }
    .case-metric:last-child { border-right:0; }
    .case-metric span { display:block; color:var(--muted); font-size:9px; }
    .case-metric strong { display:block; margin-top:4px; font:850 16px/1.1 ui-monospace,monospace; overflow-wrap:anywhere; }
    .case-metric small { display:block; margin-top:4px; color:var(--muted); font-size:9px; overflow-wrap:anywhere; }
    .vbench { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line); }
    .vbench div { min-width:0; padding:8px 5px; text-align:center; border-right:1px solid #e2e8e5; }
    .vbench div:last-child { border-right:0; }
    .vbench span { display:block; color:var(--muted); font-size:8px; overflow-wrap:anywhere; }
    .vbench strong { display:block; margin-top:4px; font:750 10px/1 ui-monospace,monospace; }
    .prompts { display:grid; grid-template-columns:1fr 1fr; }
    .prompt { min-width:0; padding:11px 13px; border-right:1px solid var(--line); }
    .prompt:last-child { border-right:0; }
    .prompt h4 { margin:0; color:var(--green); font-size:10px; }
    .prompt:last-child h4 { color:var(--red); }
    .prompt p { margin:6px 0 0; color:#35473f; font-size:12px; line-height:1.55; overflow-wrap:anywhere; }
    .empty { margin-top:18px; padding:30px; text-align:center; color:var(--muted); background:var(--paper); border:1px solid var(--line); }
    @media (max-width:1250px) { .directory { grid-template-columns:repeat(4,1fr); } .group-tab:nth-child(4) { border-right:0; } .group-tab:nth-child(-n+4) { border-bottom:1px solid var(--line); } }
    @media (max-width:900px) { .case-grid { grid-template-columns:1fr; } .group-head { grid-template-columns:1fr; } .group-summary { flex-wrap:wrap; } }
    @media (max-width:620px) { .topbar,main { padding-left:14px; padding-right:14px; } .brand p { display:none; } .directory { grid-template-columns:repeat(2,1fr); } .group-tab { border-bottom:1px solid var(--line); } .group-tab:nth-child(2n) { border-right:0; } .case-metrics { grid-template-columns:1fr; } .case-metric { border-right:0; border-bottom:1px solid var(--line); } .case-metric:last-child { border-bottom:0; } .vbench { grid-template-columns:repeat(4,1fr); } .prompts { grid-template-columns:1fr; } .prompt { border-right:0; border-bottom:1px solid var(--line); } }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">PHYSV</div><div><h1>控制变量物理视频组</h1><p>V2V · F11 TABLE HEIGHT · F12 INCLINE</p></div></div><button id="refresh" class="refresh" type="button" title="重新读取数据">↻ 刷新数据</button></div></header>
  <main><nav id="directory" class="directory" aria-label="实验组"></nav><section id="content" aria-live="polite"><div class="empty">读取中...</div></section></main>
  <script>
    const GROUP_ORDER=["V2V_GAP","V2V_OBSTACLE","V2V_BOWL","V2V_PENDULUM","V2V_SEESAW","V2V_DOMINO","F11","F12"];
    const GROUP_NAMES={V2V_GAP:"平台间隙",V2V_OBSTACLE:"障碍碰撞",V2V_BOWL:"碗内运动",V2V_PENDULUM:"摆锤",V2V_SEESAW:"跷跷板",V2V_DOMINO:"多米诺",F11:"F11 桌高",F12:"F12 斜面"};
    const GROUP_PREFIX={V2V_GAP:"V2V",V2V_OBSTACLE:"V2V",V2V_BOWL:"V2V",V2V_PENDULUM:"V2V",V2V_SEESAW:"V2V",V2V_DOMINO:"V2V",F11:"CONTROL",F12:"CONTROL"};
    const VBENCH={subject_consistency:"主体",background_consistency:"背景",temporal_flickering:"闪烁",motion_smoothness:"平滑",dynamic_degree:"动态",aesthetic_quality:"美学",imaging_quality:"画质"};
    const state={groups:[],selected:GROUP_ORDER[0],loading:false}; const $=id=>document.getElementById(id);
    function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined&&text!==null)el.textContent=String(text);return el;}
    function number(value,digits=3){const n=Number(value);return Number.isFinite(n)?n.toFixed(digits):"-";}
    function activeGroup(){return state.groups.find(group=>group.family_key===state.selected)||state.groups[0];}
    function controlLabel(item){const c=item.control||{};return c.value_label||`${c.value??"-"} ${c.units||""}`.trim();}
    function shortId(id){return id.length>25?`${id.slice(0,22)}...`:id;}
    function renderDirectory(){const host=$("directory");host.replaceChildren();GROUP_ORDER.forEach(key=>{const group=state.groups.find(item=>item.family_key===key);if(!group)return;const summary=group.trajectory_similarity||{};const button=node("button",`group-tab${key===state.selected?" active":""}`);button.type="button";button.append(node("span","group-code",GROUP_PREFIX[key]),node("span","group-name",GROUP_NAMES[key]||key),node("span","group-stat",`${group.cases.length} cases · sim ${number(summary.mean_pairwise_similarity,3)}`));button.onclick=()=>{state.selected=key;render();window.scrollTo({top:0,behavior:"smooth"});};host.append(button);});}
    function renderMatrix(group){const summary=group.trajectory_similarity||{},ids=summary.case_ids||[],values=summary.similarity_matrix||[];const wrap=node("section","matrix-wrap"),title=node("div","matrix-title");title.append(node("h3","","组内刚体轨迹相似度矩阵"),node("span","","1.000 表示轨迹一致；平移与旋转均按初始状态对齐"));wrap.append(title);if(!ids.length){wrap.append(node("div","empty","暂无轨迹相似度"));return wrap;}const table=node("table","matrix"),head=document.createElement("thead"),hr=document.createElement("tr");hr.append(node("th","","case"));ids.forEach(id=>hr.append(node("th","mono",shortId(id))));head.append(hr);table.append(head);const body=document.createElement("tbody");ids.forEach((id,r)=>{const row=document.createElement("tr");row.append(node("th","",id));ids.forEach((_,c)=>{const value=values[r]?.[c],cls=r===c?"self":value>=.8?"high":value<.6?"low":"";row.append(node("td",cls,number(value,3)));});body.append(row);});table.append(body);wrap.append(table);return wrap;}
    function metric(label,value,note){const box=node("div","case-metric");box.append(node("span","",label),node("strong","",value),node("small","",note||""));return box;}
    function caseCard(item){const card=node("article","case-card"),head=node("header","case-head"),left=document.createElement("div");left.append(node("div","case-id",item.case_id),node("h3","",item.title));const control=node("div","control");control.append(node("strong","",controlLabel(item)),node("span","",item.control?.variable||"控制变量"));head.append(left,control);card.append(head);const video=document.createElement("video");video.controls=true;video.playsInline=true;video.preload="metadata";video.src=`/media/${encodeURIComponent(item.case_id)}/full`;card.append(video);const amplitude=item.motion_amplitude||{},similarity=item.trajectory_similarity||{},closest=similarity.most_similar_case;const metrics=node("section","case-metrics");metrics.append(metric("总刚体运动长度",`${number(amplitude.motion_amplitude_m,4)} m`,`${amplitude.dynamic_object_count||0} 个动态物体`),metric("组内平均轨迹相似度",number(similarity.mean_peer_similarity,4),"motion-weighted"),metric("最相似 case",closest?number(closest.similarity,4):"-",closest?.case_id||"-"));card.append(metrics);const vbench=node("section","vbench");Object.entries(VBENCH).forEach(([key,label])=>{const box=document.createElement("div");box.append(node("span","",label),node("strong","",number(item.vbench?.[key]?.score,3)));vbench.append(box);});card.append(vbench);const prompts=node("section","prompts"),specific=node("div","prompt"),abstract=node("div","prompt");specific.append(node("h4","","具体变量 Prompt"),node("p","",item.captions?.specific||"-"));abstract.append(node("h4","","模糊变量 Prompt"),node("p","",item.captions?.abstract||"-"));prompts.append(specific,abstract);card.append(prompts);return card;}
    function renderContent(){const host=$("content");host.replaceChildren();const group=activeGroup();if(!group){host.append(node("div","empty","没有可显示的实验组"));return;}const summary=group.trajectory_similarity||{},head=node("header","group-head"),title=document.createElement("div");title.append(node("div","eyebrow",`${GROUP_PREFIX[group.family_key]} / ${group.family_key}`),node("h2","",GROUP_NAMES[group.family_key]||group.family_key));const stats=node("div","group-summary");[[group.cases.length,"cases"],[number(summary.mean_pairwise_similarity,4),"平均相似度"],[`${number(summary.min_pairwise_similarity,3)}–${number(summary.max_pairwise_similarity,3)}`,"相似度范围"]].forEach(([value,label])=>{const item=node("div","summary-item");item.append(node("strong","",value),node("span","",label));stats.append(item);});head.append(title,stats);host.append(head,renderMatrix(group));const grid=node("section","case-grid");group.cases.forEach(item=>grid.append(caseCard(item)));host.append(grid);}
    function render(){renderDirectory();renderContent();}
    async function loadData(){if(state.loading)return;state.loading=true;const button=$("refresh");button.disabled=true;button.textContent="刷新中...";try{const response=await fetch("/api/dataset",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);const payload=await response.json();state.groups=(payload.groups||[]).sort((a,b)=>GROUP_ORDER.indexOf(a.family_key)-GROUP_ORDER.indexOf(b.family_key));if(!state.groups.some(group=>group.family_key===state.selected))state.selected=state.groups[0]?.family_key||"";render();button.textContent="↻ 刷新数据";}catch(error){$("content").replaceChildren(node("div","empty",`读取失败：${error.message}`));button.textContent="↻ 重试";}finally{state.loading=false;button.disabled=false;}}
    $("refresh").onclick=loadData;loadData();
  </script>
</body>
</html>
