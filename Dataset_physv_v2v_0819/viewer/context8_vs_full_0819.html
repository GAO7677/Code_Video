<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysV context8 vs full</title>
  <style>
    :root { color-scheme: dark; --bg: #0e1214; --panel: #171d20; --panel2: #20282c; --line: #303a40; --text: #eef3f4; --muted: #a2adb2; --accent: #e1ad5b; --ok: #7dce9f; --bad: #ee8b8b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
    header { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 24px; background: rgba(14,18,20,.97); border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .sub { margin-top: 3px; color: var(--muted); }
    button { border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; color: var(--text); background: #232c31; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    main { max-width: 1600px; margin: 0 auto; padding: 22px 24px 48px; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 16px; color: var(--muted); }
    .grid { display: grid; gap: 18px; }
    article { overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .head { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; padding: 12px 15px 9px; border-bottom: 1px solid var(--line); }
    .case-id { color: var(--accent); font-weight: 700; overflow-wrap: anywhere; }
    .status { color: var(--ok); font-size: 12px; }
    .status.partial, .status.error { color: var(--bad); }
    .meta { padding: 10px 15px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
    .meta strong { color: var(--text); }
    .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
    .media { min-width: 0; background: var(--panel); }
    .media-title { display: flex; justify-content: space-between; gap: 8px; padding: 8px 11px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: 12px; }
    .media-title strong { color: var(--accent); }
    .media-title span { color: var(--muted); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #050707; }
    .answer { padding: 12px 14px 14px; border-top: 1px solid var(--line); }
    .answer h2 { margin: 0 0 6px; color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .answer p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .answer.error p { color: var(--bad); }
    details { margin: 0 14px 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); }
    summary { color: var(--text); cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, monospace; }
    @media (max-width: 900px) { header { padding: 13px 15px; } main { padding: 15px 12px 36px; } .media-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>PhysV · context8 vs full video</h1><div class="sub">Cycles RGB frames only · paired prompt comparison</div></div>
    <button id="refresh" type="button" title="Refresh results">↻ Refresh</button>
  </header>
  <main>
    <div class="toolbar"><span id="summary">Loading...</span><span id="updated"></span></div>
    <section id="grid" class="grid"></section>
  </main>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const answer = (label, item) => {
      const status = item?.status === 'ok' ? '' : ' error';
      const text = item?.status === 'ok' ? item.text : (item?.error || 'Pending');
      return `<div class="answer${status}"><h2>${esc(label)}</h2><p>${esc(text)}</p></div>`;
    };
    const requestLabel = item => item?.video_request ? JSON.stringify(item.video_request) : '';
    function showError(error) { document.querySelector('#summary').textContent = error.toString(); }
    async function load() {
      const response = await fetch('/api/cases?ts=' + Date.now(), {cache: 'no-store'});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const rows = await response.json();
      document.querySelector('#summary').textContent = `${rows.length} demo cases · context = exact 8 frames · full = complete video`;
      document.querySelector('#updated').textContent = new Date().toLocaleTimeString();
      document.querySelector('#grid').innerHTML = rows.map(row => {
        const control = row.control || {};
        const controlText = control.variable ? `${control.variable} = ${control.value_label || control.value || '-'}` : '-';
        const status = row.status || 'pending';
        return `<article><div class="head"><span class="case-id">${esc(row.case_id)}</span><span class="status ${esc(status)}">${esc(status)}</span></div><div class="meta"><strong>${esc(row.title || row.task_type || '')}</strong> · ${esc(row.taxonomy || '')} · ${esc(controlText)}</div><div class="media-grid"><div class="media"><div class="media-title"><strong>Context · first 8 frames</strong><span>${esc(requestLabel(row.context))}</span></div><video controls playsinline preload="metadata" src="/media/${encodeURIComponent(row.case_id)}/context8"></video>${answer('Context prompt output', row.context)}</div><div class="media"><div class="media-title"><strong>Full video</strong><span>${esc(requestLabel(row.full))}</span></div><video controls playsinline preload="metadata" src="/media/${encodeURIComponent(row.case_id)}/full"></video>${answer('Full-video prompt output', row.full)}</div></div><details><summary>Prompts and run metadata</summary><pre>${esc(JSON.stringify({context_prompt: row.context?.prompt, full_prompt: row.full?.prompt, model: row.model, physical_gpu: row.physical_gpu, source_basis: row.source_basis, excluded_from_captioning: row.caption_inputs_exclude, context_metadata: row.context?.video_metadata, full_metadata: row.full?.video_metadata}, null, 2))}</pre></details></article>`;
      }).join('') || '<article><div class="answer"><p>No result records yet.</p></div></article>';
    }
    document.querySelector('#refresh').addEventListener('click', () => load().catch(showError));
    load().catch(showError);
    setInterval(() => load().catch(() => {}), 5000);
  </script>
</body>
</html>
