<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysV / test70 Caption Monitor</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0e13; --panel:#111923; --panel-2:#16212c; --line:#283744; --text:#e8eef2; --muted:#8fa0ad; --lime:#d8ff5a; --amber:#ffbf69; --cyan:#94dcff; --red:#ff8c8c; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 86% 0%, #182b2f 0, transparent 36rem), var(--bg); color:var(--text); font:14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    header { border-bottom:1px solid var(--line); padding:26px clamp(18px,4vw,64px) 20px; }
    .eyebrow { color:var(--lime); font:11px/1.2 ui-monospace, SFMono-Regular, monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:8px 0 4px; font-size:clamp(24px,4vw,42px); letter-spacing:-.04em; font-weight:670; }
    .lede { margin:0; max-width:800px; color:var(--muted); }
    main { max-width:1600px; margin:auto; padding:20px clamp(18px,4vw,64px) 52px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:17px; }
    .stat { border:1px solid var(--line); background:rgba(17,25,35,.82); padding:13px 15px; }
    .stat strong { display:block; color:var(--lime); font:700 26px/1.05 ui-monospace, SFMono-Regular, monospace; }
    .stat span { color:var(--muted); font-size:12px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:15px; }
    input, select, button { border:1px solid var(--line); background:var(--panel-2); color:var(--text); padding:9px 11px; border-radius:3px; font:inherit; }
    input { min-width:260px; flex:1; }
    button { cursor:pointer; color:var(--lime); }
    button:hover, button:focus-visible, input:focus-visible, select:focus-visible { border-color:var(--lime); outline:2px solid color-mix(in srgb, var(--lime) 35%, transparent); outline-offset:1px; }
    .stamp { color:var(--muted); margin-left:auto; font:12px ui-monospace, SFMono-Regular, monospace; }
    .case-list { display:grid; gap:13px; }
    article { border:1px solid var(--line); background:rgba(17,25,35,.9); }
    .case-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:12px 15px 9px; border-bottom:1px solid var(--line); }
    .case-id { color:var(--amber); font:600 14px ui-monospace, SFMono-Regular, monospace; overflow-wrap:anywhere; }
    .status { color:var(--lime); font:11px ui-monospace, SFMono-Regular, monospace; letter-spacing:.08em; text-transform:uppercase; }
    .status.pending { color:var(--amber); }
    .case-body { display:grid; grid-template-columns:minmax(360px,1.15fr) minmax(340px,.85fr); gap:18px; padding:15px; }
    .label { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font:11px ui-monospace, SFMono-Regular, monospace; letter-spacing:.08em; margin:0 0 7px; text-transform:uppercase; }
    video { display:block; width:100%; aspect-ratio:16/9; object-fit:contain; background:#05080b; border:1px solid var(--line); }
    .caption { min-height:158px; padding:14px 15px; border-left:3px solid var(--lime); background:var(--panel-2); white-space:pre-wrap; overflow-wrap:anywhere; }
    .caption.pending { border-left-color:var(--amber); color:var(--muted); }
    .meta { display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:9px; color:var(--muted); font:11px ui-monospace, SFMono-Regular, monospace; }
    details { margin-top:12px; border-top:1px solid var(--line); padding-top:9px; color:var(--muted); }
    summary { cursor:pointer; color:var(--cyan); }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.45 ui-monospace, SFMono-Regular, monospace; }
    .empty { border:1px dashed var(--line); color:var(--muted); padding:24px; }
    @media (max-width:900px) { .stats { grid-template-columns:repeat(2,1fr); } .case-body { grid-template-columns:1fr; } .stamp { width:100%; margin-left:0; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">PhysV / API caption monitor</div>
    <h1>输入视频 ↔ Qwen 物理场景描述</h1>
    <p class="lede">test70 全视频输入与 <code>qwen38vl_caption</code> 输出。页面每 5 秒刷新一次，已生成和待处理 case 会分开标记。</p>
  </header>
  <main>
    <section class="stats" aria-label="批处理统计">
      <div class="stat"><strong id="total">—</strong><span>目标 case</span></div>
      <div class="stat"><strong id="ready">—</strong><span>已有输出</span></div>
      <div class="stat"><strong id="pending">—</strong><span>待生成</span></div>
      <div class="stat"><strong id="model">—</strong><span>模型</span></div>
    </section>
    <div class="toolbar">
      <input id="search" type="search" placeholder="筛选 case，例如 v2v_gap 或 h140" aria-label="筛选 case">
      <select id="filter" aria-label="状态筛选"><option value="all">全部</option><option value="ready">已有输出</option><option value="pending">待生成</option></select>
      <button id="refresh" type="button">刷新</button>
      <span id="stamp" class="stamp">读取中…</span>
    </div>
    <section id="case-list" class="case-list" aria-live="polite"></section>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let payload = {cases:[]};
    function render() {
      const query = $('#search').value.trim().toLowerCase();
      const status = $('#filter').value;
      const rows = payload.cases.filter(item => (!query || item.case_id.toLowerCase().includes(query)) && (status === 'all' || item.status === status));
      $('#case-list').innerHTML = rows.map(item => {
        const pending = item.status !== 'ready';
        const caption = pending ? '该 case 尚未生成 qwen38vl_caption。API 余额恢复后，重新运行批处理即可；页面会自动刷新。' : item.caption;
        const video = item.video_available ? `<video controls playsinline preload="metadata" src="${esc(item.video_url)}"></video>` : '<div class="empty">找不到对应的 rgb_cycles.mp4</div>';
        return `<article><div class="case-head"><span class="case-id">${esc(item.case_id)}</span><span class="status ${pending ? 'pending' : ''}">${pending ? 'PENDING' : 'READY'}</span></div><div class="case-body"><div><div class="label"><span>Input / full rgb_cycles.mp4</span><span>90 frames</span></div>${video}<div class="meta"><span>source: samples/${esc(item.case_id)}/videos/rgb_cycles.mp4</span></div></div><div><div class="label"><span>Output / qwen38vl_caption</span><span>qwen3.8-27b</span></div><div class="caption ${pending ? 'pending' : ''}">${esc(caption)}</div><div class="meta"><span>prompt: describe_this_video.txt</span><span>${pending ? 'not written' : 'written to source JSON'}</span></div><details><summary>查看 JSON 路径和提示词</summary><pre>${esc(JSON.stringify({json_path:item.json_path, prompt:payload.prompt}, null, 2))}</pre></details></div></div></article>`;
      }).join('') || '<div class="empty">没有匹配的 case。</div>';
    }
    async function load() {
      try {
        const response = await fetch('/api/cases?ts=' + Date.now(), {cache:'no-store'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        payload = await response.json();
        $('#total').textContent = payload.target_count;
        $('#ready').textContent = payload.ready_count;
        $('#pending').textContent = payload.pending_count;
        $('#model').textContent = payload.model;
        $('#stamp').textContent = '最后刷新 ' + new Date().toLocaleTimeString();
        render();
      } catch (error) { $('#stamp').textContent = '读取失败：' + error.message; }
    }
    $('#search').addEventListener('input', render);
    $('#filter').addEventListener('change', render);
    $('#refresh').addEventListener('click', load);
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
