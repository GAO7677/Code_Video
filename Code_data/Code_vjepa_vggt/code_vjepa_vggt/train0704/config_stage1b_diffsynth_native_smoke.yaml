experiment:
  name: stage1b_diffsynth_native_smoke
  output_dir: /data/gaoya/agent-data/checkpoints/stage1b_diffsynth_native_smoke
  seed: 42

model:
  wan_task: ti2v-5B
  wan_ckpt_dir: /data/gaoya/ckpt/Wan-AI-Wan2.2-TI2V-5B
  freeze_vae: true
  freeze_text_encoder: true
  freeze_wan_dit: true
  freeze_wan_lora: true
  freeze_object_pooler: false
  init_wan_lora_from_checkpoint: /data/gaoya/AAA_test_video/0529/vjepa_vggt/train/checkpoints/raw_phys_state_wan_lora_continue_576x1024_f24/checkpoints/step-000500/checkpoint.safetensors
  init_wan_lora_strict: false
  init_wan_lora_zero_missing: true
  wan_lora_rank: 32
  wan_lora_alpha: 32
  wan_lora_dropout: 0.0
  wan_lora_init: gaussian
  train_jepa: false
  train_vggt: false
  jepa_activation_checkpointing: true
  object_num_queries: 4
  jepa_window_radius: 1
  latent_window_radius: 1
  cond_proj_dim: 4096
  train_object_branch: true

data:
  dataset_type: phys_state_episode
  root: /data/gaoya/AAA_test_video/Dataset_physV/0613pybullet/episodes_v1/industrial_s1_scale2_256x144_s8_f16_n6_h264_batch1500
  split: train
  resolution: [512, 896]
  num_context_frames: 8
  context_fraction: 0.5
  random_context_frames: false
  batch_size: 1
  num_workers: 0
  fps: 30
  init_scan_limit: 10

optimization:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  optimizer_type: adamw
  max_steps: 4
  grad_accum_steps: 1
  max_grad_norm: 1.0
  mixed_precision: bf16

loss:
  lambda_main: 1.0

logging:
  log_every: 1
  save_every: 2
  max_checkpoints: 10
  min_checkpoint_free_gb: 1.0
  use_wandb: false
