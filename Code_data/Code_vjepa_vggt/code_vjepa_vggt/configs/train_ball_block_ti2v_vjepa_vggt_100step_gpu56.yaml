experiment:
  name: ball_block_ctx8_ti2v5b_vjepa_vggt_100step_gpu56
  output_dir: /data/gaoya/AAA_test_video/0529/vjepa_vggt/train/checkpoints/ball_block_ctx8_ti2v5b_vjepa_vggt_100step_gpu56
  seed: 42

model:
  wan_task: ti2v-5B
  wan_ckpt_dir: /data/gaoya/ckpt/Wan-AI-Wan2.2-TI2V-5B
  freeze_vae: true
  freeze_text_encoder: true
  freeze_wan_dit: false
  enable_sam2_priors: true
  sam2_prior_strategy: grounded_text_multi
  sam2_segment_len: 8
  sam2_enable_text_prompt: false
  sam2_max_objects: 4
  je_pa_variant: vitg384
  je_pa_ckpt_dir: /data/gaoya/ckpt/facebook-vjepa2-vitg-fpc64-384
  vggt_model_path: /data/gaoya/ckpt/facebook-VGGT-1B
  vggt_input_hw: [420, 728]
  track_source: vggt
  cotracker_checkpoint: /data/gaoya/ckpt/facebook-cotracker3/scaled_offline.pth
  cotracker_input_hw: [384, 512]
  cotracker_window_len: 60
  object_num_queries: 8
  jepa_input_size: 384
  jepa_patch_size: 16
  jepa_tubelet_size: 2
  jepa_window_radius: 1
  latent_window_radius: 1
  cond_proj_dim: 4096
  min_text_tokens: 64

data:
  dataset_type: ball_block_json
  root: /data/gaoya/AAA_test_video/Dataset_physV/0526dp/ball_block_dense_episodes
  num_frames: 81
  num_context_frames: 8
  random_context_frames: false
  sampling_mode: prefix
  resolution: [704, 1280]
  batch_size: 1
  num_workers: 2
  fps: 120

optimization:
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_steps: 100
  grad_accum_steps: 1
  max_grad_norm: 1.0
  mixed_precision: bf16

loss:
  future_only: true
  predict_type: flow_match_velocity
  lambda_main: 1.0
  lambda_jepa_align: 0.1
  lambda_vggt_align: 0.1
  lambda_vggt_iou: 0.1
  track_iou_radius_px: 12.0

logging:
  log_every: 10
  save_every: 20
