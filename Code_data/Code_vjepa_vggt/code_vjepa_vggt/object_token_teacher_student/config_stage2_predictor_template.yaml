experiment:
  name: pybullet0629_teacher_student_stage2_predictor
  output_dir: /data/gaoya/AAA_test_video/0623/train/train0624/checkpoints/pybullet0629_teacher_student_stage2_predictor
  seed: 42

model:
  wan_task: ti2v-5B
  wan_ckpt_dir: /data/gaoya/ckpt/Wan-AI-Wan2.2-TI2V-5B
  freeze_vae: true
  freeze_text_encoder: true
  freeze_wan_dit: true
  freeze_wan_lora: true
  freeze_object_pooler: true
  train_jepa: false
  train_vggt: false
  jepa_activation_checkpointing: true
  enable_sam2_priors: false
  sam2_prior_strategy: disabled
  sam2_segment_len: 8
  sam2_enable_text_prompt: false
  sam2_max_objects: 4
  je_pa_variant: vitg384
  je_pa_ckpt_dir: /data/gaoya/ckpt/facebook-vjepa2-vitg-fpc64-384
  vggt_model_path: /data/gaoya/ckpt/facebook-VGGT-1B
  vggt_input_hw: [420, 728]
  track_source: cotracker
  cotracker_checkpoint: /data/gaoya/ckpt/facebook-cotracker3/scaled_offline.pth
  cotracker_input_hw: [384, 512]
  cotracker_window_len: 60
  object_num_queries: 8
  jepa_input_size: 384
  jepa_patch_size: 16
  jepa_tubelet_size: 2
  jepa_window_radius: 1
  latent_window_radius: 1
  cond_proj_dim: 4096
  predictor_max_context_latent_frames: 4
  predictor_max_future_latent_frames: 8
  min_text_tokens: 64

data:
  dataset_type: phys_state_episode
  root: /data/gaoya/AAA_test_video/Dataset_physV/0613pybullet/episodes_v1/industrial_s1_scale2_256x144_s8_f16_n6_h264_batch1500
  split: train
  resolution: [512, 896]
  num_context_frames: 8
  context_fraction: 0.5
  random_context_frames: false
  batch_size: 1
  num_workers: 4
  fps: 30

optimization:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_steps: 20000
  grad_accum_steps: 1
  max_grad_norm: 1.0
  mixed_precision: bf16

loss:
  lambda_future_token: 1.0
  lambda_future_track: 0.1
  lambda_future_box: 0.1
  future_track_delta_scale: 0.06
  future_box_delta_scale: 0.06
  future_box_wh_log_scale: 1.25
  future_box_wh_max_scale: 2.0

logging:
  log_every: 10
  save_every: 500
  max_checkpoints: 2
  min_checkpoint_free_gb: 5.0
  use_wandb: true
  wandb_project: vjepa_vggt_wan
  wandb_run_name: pybullet0629_teacher_student_stage2_predictor
  wandb_dir: /data/gaoya/AAA_test_video/0623/train/train0624/wandb
