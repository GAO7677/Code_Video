  work_root: /data/gaoya/AAA_test_video/Benchmark/VBench
  vbench_cache_dir: /data/gaoya/AAA_test_video/Benchmark/VBench/cache/vbench
  vbench2_cache_dir: /data/gaoya/AAA_test_video/Benchmark/VBench/cache/vbench2

runtime:
  device: cuda
  load_ckpt_from_local: true
  read_frame: false
